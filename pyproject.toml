[project]
name = "earwarden"
version = "1.0.1.dev0"
description = "Answer Claude Code permission prompts by voice, with confirmation strength set by risk."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "rehaan" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
dependencies = [
    "metaphone==0.6",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
earwarden-hook = "earwarden.connectors.claude_code.hook:main"
earwardend = "earwarden.daemon.cli:main"
earwarden = "earwarden.cli:main"

[project.optional-dependencies]
# The voice stack for `uv tool install 'earwarden[voice]'`, macOS on Apple Silicon only.
# `misaki` without its [en] extra, so espeak-ng and phonemizer (GPL) aren't installed (D-022).
# spaCy's English model is a direct URL, which PyPI refuses as a dependency: `earwarden setup`
# installs it. torch is not needed.
voice = [
    "mlx-audio==0.6.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki==0.9.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "spacy>=3.8 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "num2words>=0.5 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.26 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sounddevice>=0.5 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "onnxruntime>=1.20 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Repository = "https://github.com/rk-python5/Earwarden"
Changelog = "https://github.com/rk-python5/Earwarden/blob/main/CHANGELOG.md"
Documentation = "https://github.com/rk-python5/Earwarden/blob/main/docs/quickstart.md"
Issues = "https://github.com/rk-python5/Earwarden/issues"
Security = "https://github.com/rk-python5/Earwarden/blob/main/SECURITY.md"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]
# The voice stack, macOS on Apple Silicon only: `uv sync --group voice` on the Mac (D-023).
voice = [
    "mlx-audio==0.6.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki==0.9.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "spacy>=3.8 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "num2words>=0.5 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.26 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sounddevice>=0.5 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "onnxruntime>=1.20 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "earwarden"
# The helper's Swift source ships; what swift build makes from it doesn't.
wheel-exclude = ["**/.build/**", "**/.swiftpm/**"]
source-exclude = ["**/.build/**", "**/.swiftpm/**"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",   # bugbear
    "C4",  # comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import order
    "N",   # naming
    "PT",  # pytest style
    "PTH", # pathlib over os.path
    "RUF", # ruff-specific
    "S",   # bandit security checks
    "SIM", # simplifications
    "UP",  # modern syntax for the target version
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert and run the scripts under test as subprocesses.
"tests/**" = ["S101", "S603"]
# Spikes are measurement scripts that shell out to macOS tools.
"spikes/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "spikes/hook_probe", "spikes/speech/speech_data.py", "spikes/speech/combine.py", "spikes/launchd_mic/agent.py"]

# The voice stack is installed only on the Mac (`uv sync --group voice`).
[[tool.mypy.overrides]]
module = ["mlx.*", "mlx_audio.*", "sounddevice", "numpy", "metaphone", "onnxruntime"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["redteam: the red-team suite (Phase 4); an approval through any of it blocks a release"]
xfail_strict = true
filterwarnings = ["error"]
