[project]
name = "earshot-agents"
version = "0.2.0.dev0"
description = "Answer Claude Code permission prompts by voice, with confirmation strength set by risk."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "rehaan" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
earshot-hook = "earshot.connectors.claude_code.hook:main"
earshotd = "earshot.daemon.cli:main"
earshot = "earshot.cli:main"

[project.urls]
Repository = "https://github.com/rk-python5/Earshot"
Changelog = "https://github.com/rk-python5/Earshot/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]
# The voice stack, macOS on Apple Silicon only: `uv sync --group voice` on the Mac (D-023).
voice = [
    "mlx-audio==0.6.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki[en]==0.9.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.26 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sounddevice>=0.5 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "earshot"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",   # bugbear
    "C4",  # comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import order
    "N",   # naming
    "PT",  # pytest style
    "PTH", # pathlib over os.path
    "RUF", # ruff-specific
    "S",   # bandit security checks
    "SIM", # simplifications
    "UP",  # modern syntax for the target version
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert and run the scripts under test as subprocesses.
"tests/**" = ["S101", "S603"]
# Spikes are measurement scripts that shell out to macOS tools.
"spikes/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "spikes/hook_probe", "spikes/speech/speech_data.py", "spikes/speech/combine.py", "spikes/launchd_mic/agent.py"]

# The voice stack is installed only on the Mac (`uv sync --group voice`).
[[tool.mypy.overrides]]
module = ["mlx.*", "mlx_audio.*", "sounddevice", "numpy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
