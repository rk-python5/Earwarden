name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests and the Swift build
    # Apple Silicon. macos-14 was retired on 2026-11-02; see decisions.md D-010.
    # One job, not two: GitHub's Mac runners kept one of two jobs waiting until its timeout,
    # and a private repository's Mac minutes are counted per job.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Build the Swift motion spike and check its bundle
        # Runs even if a Python step failed, so a Swift change is always compiled.
        if: ${{ !cancelled() }}
        working-directory: spikes/motion
        run: |
          ./run.sh --build-only
          plutil -lint .build/MotionSpike.app/Contents/Info.plist
          codesign --verify --verbose .build/MotionSpike.app
      - name: Build the signed helper and check its bundle
        if: ${{ !cancelled() }}
        working-directory: src/earshot/helper_app
        run: |
          ./build.sh
          plutil -lint .build/EarshotMotion.app/Contents/Info.plist
          codesign --verify --verbose .build/EarshotMotion.app
