name: Release

# Pushing a tag like v1.0.0 runs the checks, builds the wheel and source archive, publishes them to
# PyPI with trusted publishing (no token is stored), and attaches them to a GitHub release.
#
# One-time setup, by the repository's owner:
#   1. PyPI: add a pending trusted publisher for `earwarden`: owner rk-python5, repository
#      Earwarden, workflow release.yml, environment pypi.
#   2. GitHub: Settings > Environments > New environment, named `pypi`.
#   3. GitHub: Settings > Code security > enable private vulnerability reporting (SECURITY.md).
#   4. Attach the two voiceprint model files to a release tagged model-ecapa-1 (docs/releasing.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Checks and build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The tag matches the version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - name: Install
        run: uv sync --locked
      - name: Lint, types and tests, red team included
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest
      - name: The helper builds from the packaged source
        run: |
          cp -R src/earwarden/helper_app "$RUNNER_TEMP/helper"
          (cd "$RUNNER_TEMP/helper" && ./build.sh)
          codesign --verify --verbose "$RUNNER_TEMP/helper/.build/EarwardenMotion.app"
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Earwarden ${GITHUB_REF_NAME#v}" \
            --notes "See the [changelog](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)."
